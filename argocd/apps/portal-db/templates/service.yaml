apiVersion: v1
kind: Service
metadata:
  name: {{ include "portal-db.fullname" . }}
  labels:
    {{- include "portal-db.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: http
  selector:
    app: portal-db
    {{- include "portal-db.selectorLabels" . | nindent 4 }}
