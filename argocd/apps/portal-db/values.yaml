# -- Default values for portal-db
# -- This is a YAML-formatted file defining configuration variables for Helm templates

# -- Number of replicas for the deployment
replicaCount: 1  

image:
  # -- Container image repository
  repository: savannah.ornl.gov/kdi/coreii-data-lake/portalsql  
  # -- Always pull the latest image when deploying
  pullPolicy: Always  
  # -- Image tag to use; defaults to "latest"
  tag: "latest"  

imagePullSecrets:
  # -- Secret used for pulling the image from a private registry
  - name: savannah-creds  

service:
  # -- Type of Kubernetes service (ClusterIP means internal communication only)
  type: ClusterIP  
  # -- Port exposed within the cluster
  port: 1433  
  # -- Port the container listens on
  targetport: 1433  

ingress:
  # -- Enables Ingress for external access (though DBs usually don't use Ingress)
  enabled: true  
  className: ""  
  annotations: {}  
    # Example annotations:
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local  
      paths:
        - path: /
          pathType: ImplementationSpecific  
  tls: []  

resources: 
  limits:
    # -- CPU limit for the container
    cpu: 100m  
    # -- Memory limit for the container
    memory: 3Gi  
  requests:
    # -- Minimum CPU request for scheduling
    cpu: 50m  
    # -- Minimum memory request for scheduling
    memory: 1.5Gi  

pvc:
  # -- Persistent Volume Claim configuration for database storage
  name: portal-db-pvc  
  accessModes:
    - ReadWriteOnce  
  storage:
    size: 5Gi  
  storageClassName: longhorn  

# -- Enables Pod Disruption Budget to prevent excessive pod disruptions
pdb:
  enabled: true  

autoscaling:
  # -- Enables Horizontal Pod Autoscaler
  enabled: true  
  # -- Minimum number of replicas
  minReplicas: 1  
  # -- Maximum number of replicas
  maxReplicas: 100  
  # -- Scale up/down based on CPU utilization threshold
  targetCPUUtilizationPercentage: 80  
  # -- Scale up/down based on memory utilization threshold
  targetMemoryUtilizationPercentage: 80  

secret:
  # -- Enables secrets
  enabled: true
  # -- Base64-encoded MSSQL password
  mssqlpassword: b2l2am8zNEJqbmkyb2lqMg==  

serviceAccount:
  # -- If true, a ServiceAccount will be created
  enabled: true  
  # -- Name of the ServiceAccount. If left empty, the release name will be used.
  name: "portal-db"  
  # -- Annotations to add to the ServiceAccount
  annotations: {}  
