# -- Default values for portal-api
# -- This is a YAML-formatted file defining configuration variables for Helm templates

# -- Number of replicas for the deployment
replicaCount: 1  

image:
  # -- Container image repository
  repository: savannah.ornl.gov/kdi/coreii-data-lake/portalapi  
  # -- Always pull the latest image when deploying
  pullPolicy: Always  
  # -- Image tag to use; defaults to "latest"
  tag: "latest"  

imagePullSecrets:
  # -- Secret used for pulling the image from a private registry
  - name: savannah-creds  

service:
  # -- Type of Kubernetes service (ClusterIP means internal communication only)
  type: ClusterIP  
  # -- Port exposed within the cluster
  port: 80  
  # -- Port the container listens on
  targetport: 8080  

ingress:
  # -- Enables Ingress for external access
  enabled: true  
  annotations: 
    # -- Ensures proper URL routing
    nginx.ingress.kubernetes.io/rewrite-target: /  
  hosts:
    - host: portal-api.caiser.ornlkdi.org  
      paths:
        - path: /
          # -- Matches all paths under "/"
          pathType: Prefix  
  tls:
    - hosts:
        - portal-api.caiser.ornlkdi.org  
      # -- Secret name for storing TLS certificates
      secretName: tls  

resources: 
  limits:
    # -- CPU limit for the container
    cpu: 50m  
    # -- Memory limit for the container
    memory: 300Mi  
  requests:
    # -- Minimum CPU request for scheduling
    cpu: 10m  
    # -- Minimum memory request for scheduling
    memory: 150Mi  

autoscaling:
  # -- Enables Horizontal Pod Autoscaler
  enabled: true  
  # -- Minimum number of replicas
  minReplicas: 1  
  # -- Maximum number of replicas
  maxReplicas: 100  
  # -- Scale up/down based on CPU utilization threshold
  targetCPUUtilizationPercentage: 80  
  # -- Scale up/down based on memory utilization threshold
  targetMemoryUtilizationPercentage: 80  

# -- Enables Pod Disruption Budget to prevent excessive pod disruptions
pdb:
  enabled: true  

secret:
  # -- Enables Secrets
  enabled: true
  # -- Kubernetes Secret name for LDAP and database credentials
  name: ldap-creds  
  # -- Base64-encoded LDAP server address
  ldapserver: MTkyLjE2OC4zLjI0Nw==  
  # -- Base64-encoded MSA account
  msaaccount: aW5sMDAxcG9ydGFsQGNhaXNlci5vcm5sa2RpLm9yZw==  
  # -- Base64-encoded MSA password
  msapassword: SG1OSnViQzRMc1F3WGhhQjdBVXBqNTJ5  
  # -- Base64-encoded LDAP search DN
  searchdn: T1U9VXNlcnMsT1U9Y2Fpc2VyLERDPWNhaXNlcixEQz1vcm5sa2RpLERDPW9yZw==  
  # -- Base64-encoded MSSQL password
  mssqlpassword: b2l2am8zNEJqbmkyb2lqMg==  

serviceAccount:
  # -- If true, a ServiceAccount will be created
  enabled: true  
  # -- Name of the ServiceAccount. If left empty, the release name will be used.
  name: "portal-api"  
  # -- Annotations to add to the ServiceAccount
  annotations: {}  
