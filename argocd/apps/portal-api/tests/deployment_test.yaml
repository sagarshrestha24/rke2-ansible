suite: Test Deployment Template
templates:
  - deployment.yaml
tests:
  - it: "should render a Deployment resource"
    asserts:
      - isKind:
          of: Deployment
  - it: "should have a non-empty metadata.name"
    asserts:
      - notEqual:
          path: metadata.name
          value: ""
  - it: "should have proper labels assigned"
    asserts:
      - equal:
          path: spec.selector.matchLabels.app
          value: portal-api
  - it: "should set CPU and memory requests correctly"
    set:
      resources.requests.cpu: "10m"
      resources.requests.memory: "150Mi"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "10m"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: "150Mi"
  - it: "should set CPU and memory limits correctly"
    set:
      resources.limits.cpu: "50m"
      resources.limits.memory: "300Mi"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "50m"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: "300Mi"