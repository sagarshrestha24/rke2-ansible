{{- if .Values.secret.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
type: Opaque
data:
  ldap-server: {{ .Values.secret.ldapserver  }}
  msa-account: {{ .Values.secret.msaaccount  }}
  msa-password: {{ .Values.secret.msapassword  }}
  search-dn: {{ .Values.secret.searchdn  }}
{{- end }}
