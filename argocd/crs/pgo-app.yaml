apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-operator
  namespace: argocd
spec:
  destination:
    name: ''
    namespace: pgo
    server: 'https://kubernetes.default.svc'
  source:
    path: argocd/apps/postgresql/pgo
    repoURL: 'https://github.com/01cloud/inl-infra.git'
    targetRevision: HEAD
  sources: []
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
