             - rke-lb.labenv.ai
             - etcd-1.labenv.ai
             - etcd-2.labenv.ai
             - etcd-3.labenv.ai
             - rke-server1.labenv.ai
             - rke-server2.labenv.ai
             - rke-server3.labenv.ai
