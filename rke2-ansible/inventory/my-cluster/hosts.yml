    192.168.3.44:
      ansible_user: ec2-user
      hostname: rke-worker1.labenv.ai
      ansible_host: 192.168.3.44
    192.168.2.134:
      ansible_user: ec2-user
      hostname: rke-worker2.labenv.ai
